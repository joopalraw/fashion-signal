kind = "web"
previewPath = "/"
title = "패션 트렌드 브리핑"
version = "1.0.0"
id = "artifacts/fashion-briefing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24535

[services.development]
run = "pnpm --filter @workspace/fashion-briefing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fashion-briefing", "run", "build" ]
publicDir = "artifacts/fashion-briefing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24535"
BASE_PATH = "/"
